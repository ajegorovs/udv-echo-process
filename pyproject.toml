[project]
name = "udv-echo-process"
version = "0.1.0"
description = "Multi-sensor UDV echo and velocity processing for rotating machinery analysis"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "plotly>=5.24",
    "pydantic>=2.10.0",
    "scikit-image>=0.26.0",
    "scipy>=1.16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16.6"]
marimo = [
    "marimo-inspect",
    "marimo[recommended]>=0.24.0,<0.25",
]

[project.scripts]
udv-inspect = "udv_echo_process.cli:inspect_main"
udv-viz = "udv_echo_process.cli:viz_main"
udv-run-all = "udv_echo_process.cli:run_all_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/udv_echo_process"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# Notebooks use marimo's own idioms; `.agents/skills/` are third-party, hash-pinned
# files. Lint/format the library and let `marimo check` validate notebook files.
exclude = ["notebooks/", ".agents/"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.uv.sources]
marimo-inspect = { git = "https://github.com/ajegorovs/marimo-mcp-cowork", tag = "v0.3.3" }
