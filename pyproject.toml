[project]
name = "udv-echo-process"
version = "0.1.0"
description = "Multi-sensor UDV echo and velocity processing for rotating machinery analysis"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "opencv-python>=4.10.0",
    "Pillow>=10.0.0",
    "pydantic>=2.10.0",
    "scikit-image>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
udv-inspect = "udv_echo_process.cli:inspect_main"
udv-viz = "udv_echo_process.cli:viz_main"
udv-run-all = "udv_echo_process.cli:run_all_main"
udv-project = "udv_echo_process.cli:project_main"
udv-mixvel = "udv_echo_process.cli:mixvel_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/udv_echo_process"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
